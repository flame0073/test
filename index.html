<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IPTV Web with Shaka Player</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
  <style>
    body { margin: 0; background: #000; color: #fff; display: flex; flex-direction: column; height: 100vh; }
    #controls { padding: 0.5rem; background: #111; display: flex; align-items: center; }
    #video { flex: 1; width: 100%; height: auto; background: #000; }
    select { padding: 0.5rem; font-size: 1rem; }
    #logo { height: 32px; margin-left: 1rem; }
  </style>
</head>
<body>
  <div id="controls">
    <label for="channel-select">Piliin ang Channel: </label>
    <select id="channel-select">
      <option value="">-- Select Channel --</option>
    </select>
    <img id="logo" src="" alt="Channel Logo" hidden>
  </div>
  <video id="video" controls autoplay muted></video>

  <script>
    /**
     * Channel type definition:
     * {
     *   name: string,
     *   manifestUri: string,
     *   clearKey?: { [keyId: string]: string },
     *   type: 'mpd' | 'hls',
     *   logo?: string
     * }
     */
    const channels = [
      {
        name: 'A2Z',
        manifestUri: 'https://qp-pldt-live-grp-02-prod.akamaized.net/out/u/cg_a2z.mpd',
        clearKey: { 'f703e4c8ec9041eeb5028ab4248fa094': 'c22f2162e176eee6273a5d0b68d19530' },
        type: 'mpd',
        logo: 'https://cdn1.clickthecity.com/wp-content/uploads/2020/10/21172907/a2z-logo.png'
      },
      {
        name: 'Anime X Hidive',
        manifestUri: 'https://amc-anime-x-hidive-1-us.tablo.wurl.tv/playlist.m3u8',
        type: 'hls',
        logo: 'https://www.tablotv.com/wp-content/uploads/2023/12/AnimeXHIDIVE_official-768x499.png'
      },
      {
        name: 'iQIYI',
        manifestUri: 'https://linearjitp-playback.astro.com.my/dash-wv/dashiso/1006/default_ott.mpd',
        clearKey: { '7ef7e913ce85a1131b27036069169a10': '77d98ed71db7524c27875a09a975f9e6' },
        type: 'mpd',
        logo: 'https://yt3.ggpht.com/a-/AAuE7mCWtM3oQ6tEkeKei5hQLBFoDIHIt3rBeg13-Q=s900-mo-c-c0xffffffff-rj-k-no'
      },
      {
        name: 'K+',
        manifestUri: 'https://linearjitp-playback.astro.com.my/dash-wv/dashiso/9983/default_ott.mpd',
        clearKey: { 'aa48b28bd723f91214887df6ed9fad10': 'b5a3a800848120c843ae0fa68c09c261' },
        type: 'mpd',
        logo: 'https://static.wikia.nocookie.net/logopedia/images/d/d8/K-Plus_%282013%29.svg/revision/latest?cb=20240723011130'
      }
    ];

    let player;
    let video;

    document.addEventListener('DOMContentLoaded', initApp);

    async function initApp() {
      if (!shaka.Player.isBrowserSupported()) {
        alert('Browser not supported for Shaka Player.');
        return;
      }

      video = document.getElementById('video');
      player = new shaka.Player(video);
      player.addEventListener('error', onErrorEvent);

      // Automatically enable English captions if available
      player.configure({
        preferredTextLanguage: 'en'
      });
      player.setTextTrackVisibility(true);

      const select = document.getElementById('channel-select');
      channels.forEach((ch, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.text = ch.name;
        select.appendChild(opt);
      });

      select.addEventListener('change', () => {
        const idx = select.value;
        if (idx !== '') {
          loadChannel(channels[idx]);
        }
      });

      // Auto-load first channel
      await loadChannel(channels[0]);
    }

    async function loadChannel(ch) {
      try {
        await player.unload();
        // Update logo
        const logoEl = document.getElementById('logo');
        if (ch.logo) {
          logoEl.src = ch.logo;
          logoEl.hidden = false;
        } else {
          logoEl.hidden = true;
        }

        // DRM config for MPD
        if (ch.type === 'mpd' && ch.clearKey) {
          player.configure({
            drm: {
              clearKeys: ch.clearKey,
              servers: { 'org.w3.clearkey': '' }
            }
          });
        } else {
          // Remove any previous DRM config
          player.configure({ drm: { clearKeys: {}, servers: {} } });
        }

        await player.load(ch.manifestUri);
        console.log('Loaded channel:', ch.name);
      } catch (error) {
        onError(error);
      }
    }

    function onErrorEvent(event) {
      onError(event.detail);
    }

    function onError(error) {
      console.error('Error code', error.code, 'object', error);
      alert('Playback error: ' + error.message);
    }
  </script>
</body>
</html>
