  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #121212;
      color: #eee;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 1rem;
      background: #1f1f1f;
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      user-select: none;
    }
    #player-container {
      flex-grow: 1;
      background: black;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 60vh;         /* desktop default height */
      max-height: 500px;
    }
    video {
      width: 100%;
      height: 100%;
      background: black;
      outline: none;
      object-fit: cover;
    }
    #error {
      position: absolute;
      bottom: 8px;
      left: 8px;
      right: 8px;
      background: rgba(255, 0, 0, 0.8);
      color: white;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.9rem;
      display: none;
      z-index: 5;
    }
    #channels {
      display: flex;
      overflow-x: auto;
      background: #1b1b1b;
      padding: 0.5rem 0.5rem;
      border-top: 1px solid #333;
      -webkit-overflow-scrolling: touch;
    }
    #channels::-webkit-scrollbar {
      height: 8px;
    }
    #channels::-webkit-scrollbar-thumb {
      background: #555;
      border-radius: 4px;
    }
    .channel {
      flex: 0 0 auto;
      width: 100px;
      height: 100px;
      margin-right: 10px;
      text-align: center;
      cursor: pointer;
      border-radius: 6px;
      border: 2px solid transparent;
      padding: 6px 4px;
      background: #222;
      transition: border-color 0.3s;
      user-select: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }
    .channel.selected {
      border-color: #1e90ff;
      background: #333;
    }
    .channel img {
      max-width: 80px;
      max-height: 45px;
      object-fit: contain;
      margin-bottom: 4px;
      transition: transform 0.3s ease;
    }
    .channel:hover img,
    .channel:focus img {
      transform: scale(1.3);
    }
    .channel-name {
      font-size: 0.75rem;
      line-height: 1.2em;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #ddd;
      height: 1.4em;
    }
    @media (max-width: 600px) {
      #player-container {
        height: 30vh;       /* smaller player height on mobile */
        max-height: 200px;
      }
      video {
        object-fit: contain; /* prevent cropping on mobile */
      }
      .channel {
        width: 75px;
        height: 90px;
      }
      .channel img {
        max-width: 60px;
        max-height: 35px;
      }
      .channel:hover img,
      .channel:focus img {
        transform: scale(1.2);
      }
      header {
        font-size: 1rem;
      }
    }
  </style>
</head>

    const video = document.getElementById("video");
    const channelsContainer = document.getElementById("channels");
    const errorDiv = document.getElementById("error");
    let player;

    function initPlayer() {
      if (shaka.Player.isBrowserSupported()) {
        player = new shaka.Player(video);
        player.addEventListener("error", onErrorEvent);
      } else {
        showError("Browser not supported by Shaka Player.");
      }
    }

    function onErrorEvent(event) {
      const error = event.detail;
      console.error("Error code", error.code, "object", error);
      showError(error.message || "An unknown error occurred.");
    }

    function showError(message) {
      errorDiv.textContent = message;
      errorDiv.style.display = "block";
    }

    function clearError() {
      errorDiv.textContent = "";
      errorDiv.style.display = "none";
    }

    function enableEnglishCaptions() {
      const tracks = player.getTextTracks();
      for (const track of tracks) {
        if (track.language === "en" || track.language.startsWith("en-")) {
          player.selectTextTrack(track);
          player.setTextTrackVisibility(true);
          console.log("English captions enabled.");
          break;
        }
      }
    }

    function createChannelList() {
      channels.forEach((channel) => {
        const div = document.createElement("div");
        div.className = "channel";
        div.setAttribute("role", "listitem");
        div.setAttribute("tabindex", 0);
        div.dataset.name = channel.name;

        const img = document.createElement("img");
        img.src = channel.logo || "";
        img.alt = channel.name + " logo";
        img.onerror = () => {
          img.style.display = "none";
        };

        const name = document.createElement("div");
        name.className = "channel-name";
        name.textContent = channel.name;

        div.appendChild(img);
        div.appendChild(name);

        div.addEventListener("click", () => loadChannel(channel));
        div.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            loadChannel(channel);
          }
        });

        channelsContainer.appendChild(div);
      });
    }

    function init() {
      createChannelList();
      initPlayer();
      if (channels.length > 0) {
        loadChannel(channels[0]);
      }
    }

    window.onload = init;
